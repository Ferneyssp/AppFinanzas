name: finanzas_student
description: "Control financiero mensual para estudiantes universitarios."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Estado de la aplicación
  provider: ^6.1.2

  # Persistencia local
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3

  # Notificaciones locales
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Reconocimiento de voz y permisos
  speech_to_text: ^7.4.0
  permission_handler: ^11.3.1

  # Utilidades
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
